<!DOCTYPE html>
<html lang="en">
    <head>

        <title>TRAVEL WEBSITE | CONTACT</title>
    </head>
<body>
    <nav class="navbar bg-dark">
        <div class="container">
                <h1 class="logo lg-heading text-light">AG</h1>
            <ul class="nav-items">
                <li class="nav-item"><a href="./index.html">Home</a></li>
                <li class="nav-item"><a href="./About.html">About</a></li>
                <li class="nav-item"><a href="./Contact.html">Contact</a></li>
            </ul>  
        </div>
       </nav>

       <section class="contact-form">
        <div class="container">
            <div class="form-wrapper">
                <div class="company-adress">
                    <div class="address-group">
                        <i class=" fas fa-map-marker-alt fa-3x text-red"></i>
                        <h2 class="text-gray md-heading">Location</h2>
                        <p>#2661 janakpuri colony, city name, town name.</p>
                    </div>
                    <div class="address-group">
                        <i class=" fa fa-envelope fa-3x text-red"></i>
                        <h2 class="text-gray md-heading">Email</h2>
                        <p>*********@gmail.com</p>
                    </div>
                    <div class="address-group">
                        <i class=" fas fa-phone-square-alt fa-3x text-red"></i>
                        <h2 class="text-gray md-heading">Call</h2>
                        <p>+91**********</p>
                    </div>
                    <img src="./img/company-img.jpg" alt="Company-Image">
                </div>
                <form action="" class="form">
                    <h1 class="lg-heading text-black">Contact Us</h1>
                    <p class="text-gray">Let us know questions, suggetions and concerns by filling out the conatact form below</p>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" name="" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="phone" name="" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                       <textarea name="" id="message"></textarea>
                    </div>
                    <button type="submit" class="form-btn">Submit</button>
                </form>   
            </div>
        </div>
    
     </section>

 <footer class="footer">

        <div class="social-media-links">
           <i class="fab fa-facebook fa-4x"></i>
           <i class="fab fa-twitter fa-4x"></i>
           <i class="fab fa-instagram fa-4x"></i>

        </div>   
        <p>World Travel © 2025, Aman Goswami, All Rights Reserved</p>
  </footer>
       
</body>
</html>
